apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain
  namespace: onaig
spec:
  replicas: 1 # One validator for now; QBFT HA requires at least four validators.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      terminationGracePeriodSeconds: 180
      containers:
        - name: besu
          image: hyperledger/besu:26.8.1@sha256:6f3f21ce533383fcc8db3bce02252b59d5a9e776b72b5a1c8ecd2db011600042
          imagePullPolicy: IfNotPresent
          command: ["/opt/besu/bin/besu"]
          args:
            - --data-path=/var/lib/besu
            - --genesis-file=/etc/besu/genesis.json
            - --node-private-key-file=/etc/besu/node.key
            - --network-id=31337
            - --rpc-http-enabled
            - --rpc-http-api=ETH,NET,WEB3,TXPOOL,QBFT
            - --rpc-http-host=0.0.0.0
            - --host-allowlist=*
            - --rpc-http-cors-origins=*
            - --p2p-enabled=true
            - --p2p-host=127.0.0.1
            - --logging=INFO
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    kill -INT 1 || true
                    while kill -0 1 2>/dev/null; do sleep 1; done
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: besu-data
              mountPath: /var/lib/besu
            - name: besu-genesis
              mountPath: /etc/besu/genesis.json
              subPath: genesis.json
              readOnly: true
            - name: besu-validator-key
              mountPath: /etc/besu/node.key
              subPath: node.key
              readOnly: true
      volumes:
        - name: besu-data
          persistentVolumeClaim:
            claimName: besu-data
        - name: besu-genesis
          configMap:
            name: besu-genesis
        - name: besu-validator-key
          secret:
            secretName: besu-validator-key
            defaultMode: 0400

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: besu-data
  namespace: onaig
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---

apiVersion: v1
kind: Service
metadata:
  name: besu
  namespace: onaig
spec:
  type: ClusterIP
  selector:
    app: blockchain
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
      protocol: TCP

---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rpc-rate-limit
  namespace: onaig
spec:
  rateLimit:
    period: 1s
    average: 100
    burst: 200

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpc-ingress
  namespace: onaig
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: onaig-rpc-rate-limit@kubernetescrd
spec:
  tls:
    - hosts:
        - onaig-rpc.duckdns.org
      secretName: onaig-rpc-tls
  rules:
    - host: onaig-rpc.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: besu
                port:
                  number: 8545
