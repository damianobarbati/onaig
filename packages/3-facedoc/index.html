<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>ONAIG FaceDoc</title>
    <script>
    tailwind = { config: { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-slate-950 text-slate-100 antialiased;
      }
      html,
      body {
        @apply h-full overflow-hidden;
      }
      video {
        transform: scaleX(-1);
      }
    }
    @layer components {
      .app-shell {
        @apply mx-auto flex h-[100dvh] w-full max-w-5xl flex-col overflow-hidden px-3 py-[env(safe-area-inset-top)] sm:px-6;
      }
      .video-card {
        @apply relative flex min-h-0 w-full flex-1 overflow-hidden rounded-3xl border border-slate-800 bg-black shadow-2xl sm:aspect-video sm:flex-none;
      }
      .action-button {
        @apply flex-1 rounded-xl px-4 py-3 text-sm font-semibold transition disabled:cursor-not-allowed disabled:opacity-50;
      }
      .register-button {
        @apply bg-cyan-400/95 text-slate-950 hover:bg-cyan-300;
      }
      .landmark-button {
        @apply rounded-xl px-3 py-1.5 text-slate-300 transition hover:bg-white/10;
      }
      .landmark-button.is-active {
        @apply bg-emerald-400 font-semibold text-slate-950;
      }
    }
    .onaig-root,
    .onaig-video,
    .onaig-landmark-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .onaig-video,
    .onaig-landmark-canvas {
      object-fit: cover;
    }
    .onaig-landmark-canvas {
      pointer-events: none;
      transform: scaleX(-1);
    }
    .overlay-card {
      @apply rounded-2xl border border-white/10 bg-slate-950/75 backdrop-blur;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="main.ts"></script>
  </body>
</html>
