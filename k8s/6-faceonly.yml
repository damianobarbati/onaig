apiVersion: apps/v1
kind: Deployment
metadata:
  name: faceonly
  namespace: onaig
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/imagePullSecret: "keel-dockerconfig"
    keel.sh/image-tag: "latest"
    keel.sh/match-tag: "true"
    keel.sh/approver: "keel"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: faceonly
  template:
    metadata:
      labels:
        app: faceonly
    spec:
      imagePullSecrets:
        - name: keel-dockerconfig
      containers:
        - name: faceonly
          image: ghcr.io/damianobarbati/onaig:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - pnpm -F faceonly preview
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---

apiVersion: v1
kind: Service
metadata:
  name: faceonly
  namespace: onaig
spec:
  selector:
    app: faceonly
  ports:
    - port: 80
      targetPort: 3001

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: faceonly-ingress
  namespace: onaig
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - onaig-faceonly.duckdns.org
      secretName: onaig-faceonly-tls
  rules:
    - host: onaig-faceonly.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: faceonly
                port:
                  number: 80
