apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain
  namespace: onaig
spec:
  replicas: 1 # Anvil state is persisted on the PVC. Do not run two instances at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: recover-corrupt-state
          image: ghcr.io/foundry-rs/foundry:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              state=/data/state.json
              if [ -f "$state" ] && ! perl -MJSON::PP -0777 -e 'decode_json(<>)' "$state" >/dev/null 2>&1; then
                rm "$state"
              fi
          volumeMounts:
            - name: anvil-data
              mountPath: /data
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:latest
          imagePullPolicy: IfNotPresent
          command: ["anvil"]
          args:
            - --host
            - 0.0.0.0
            - --chain-id
            - "31337"
            - --hardfork
            - osaka
            - --accounts
            - "10"
            - --balance
            - "10000"
            - --block-time
            - "1"
            - --state
            - /data/state.json
            - --state-interval
            - "10"
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - cast
                - chain-id
                - --rpc-url
                - http://127.0.0.1:8545
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            exec:
              command:
                - cast
                - chain-id
                - --rpc-url
                - http://127.0.0.1:8545
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: anvil-data
              mountPath: /data
      volumes:
        - name: anvil-data
          persistentVolumeClaim:
            claimName: anvil-data

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anvil-data
  namespace: onaig
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---

apiVersion: v1
kind: Service
metadata:
  name: anvil
  namespace: onaig
spec:
  type: ClusterIP
  selector:
    app: blockchain
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
      protocol: TCP

---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rpc-rate-limit
  namespace: onaig
spec:
  rateLimit:
    period: 1s
    average: 100
    burst: 200

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpc-ingress
  namespace: onaig
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: onaig-rpc-rate-limit@kubernetescrd
spec:
  tls:
    - hosts:
        - onaig-rpc.duckdns.org
      secretName: onaig-rpc-tls
  rules:
    - host: onaig-rpc.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anvil
                port:
                  number: 8545
