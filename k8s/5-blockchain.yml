apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blockchain
  namespace: onaig
spec:
  serviceName: anvil
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: restore-state
          image: ghcr.io/foundry-rs/foundry@sha256:2dbf3d0fc58593ad9d01ef57677f93f83f4987acd295d17f303448d82e3a3ae7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              state=/data/state.json
              runtime=/run/anvil/state.json
              if [ -f "$state" ] && perl -MJSON::PP -0777 -e 'decode_json(<>)' "$state" >/dev/null 2>&1; then
                cp "$state" "$runtime"
              else
                rm -f "$state"
              fi
          volumeMounts:
            - name: anvil-data
              mountPath: /data
            - name: anvil-runtime
              mountPath: /run/anvil
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry@sha256:2dbf3d0fc58593ad9d01ef57677f93f83f4987acd295d17f303448d82e3a3ae7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              exec flock -n -E 75 /data/anvil.lock anvil \
                --host 0.0.0.0 \
                --chain-id 31337 \
                --hardfork osaka \
                --accounts 10 \
                --balance 10000 \
                --block-time 1 \
                --state /run/anvil/state.json \
                --state-interval 5
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
          startupProbe:
            exec:
              command:
                - cast
                - chain-id
                - --rpc-url
                - http://127.0.0.1:8545
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - cast
                - chain-id
                - --rpc-url
                - http://127.0.0.1:8545
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            exec:
              command:
                - cast
                - chain-id
                - --rpc-url
                - http://127.0.0.1:8545
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: anvil-data
              mountPath: /data
            - name: anvil-runtime
              mountPath: /run/anvil
        - name: snapshot-state
          image: ghcr.io/foundry-rs/foundry@sha256:2dbf3d0fc58593ad9d01ef57677f93f83f4987acd295d17f303448d82e3a3ae7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                runtime=/run/anvil/state.json
                temporary=/data/.state.json.tmp
                if [ -s "$runtime" ]; then
                  cp "$runtime" "$temporary"
                  if cmp -s "$runtime" "$temporary" && perl -MJSON::PP -0777 -e 'decode_json(<>)' "$temporary" >/dev/null 2>&1; then
                    mv -f "$temporary" /data/state.json
                  else
                    rm -f "$temporary"
                  fi
                fi
                sleep 5
              done
          volumeMounts:
            - name: anvil-data
              mountPath: /data
            - name: anvil-runtime
              mountPath: /run/anvil
      volumes:
        - name: anvil-data
          persistentVolumeClaim:
            claimName: anvil-data
        - name: anvil-runtime
          emptyDir: {}

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anvil-data
  namespace: onaig
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---

apiVersion: v1
kind: Service
metadata:
  name: anvil
  namespace: onaig
spec:
  type: ClusterIP
  selector:
    app: blockchain
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
      protocol: TCP

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blockchain
  namespace: onaig
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: blockchain

---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rpc-rate-limit
  namespace: onaig
spec:
  rateLimit:
    period: 1s
    average: 100
    burst: 200

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpc-ingress
  namespace: onaig
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: onaig-rpc-rate-limit@kubernetescrd
spec:
  tls:
    - hosts:
        - onaig-rpc.duckdns.org
      secretName: onaig-rpc-tls
  rules:
    - host: onaig-rpc.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anvil
                port:
                  number: 8545
