apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain
  namespace: onaig
spec:
  replicas: 1 # Anvil keeps the chain state in memory. Do not run two instances at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:latest
          imagePullPolicy: IfNotPresent
          command: ["anvil"]
          args:
            - --host
            - 0.0.0.0
            - --chain-id
            - "31337"
            - --hardfork
            - osaka
            - --accounts
            - "10"
            - --balance
            - "10000"
            - --block-time
            - "1"
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - cast
                - chain-id
                - --rpc-url
                - http://127.0.0.1:8545
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            exec:
              command:
                - cast
                - chain-id
                - --rpc-url
                - http://127.0.0.1:8545
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

---

apiVersion: v1
kind: Service
metadata:
  name: anvil
  namespace: onaig
spec:
  type: ClusterIP
  selector:
    app: blockchain
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
      protocol: TCP
